paths:
  recordings: Q:\Development\Marketor\clips
  telemetry: C:\Users\dkoul\AppData\LocalLow\monome_studio\This Is No Cave\Telemetry
  work: Q:\Development\Marketor\shorts_work
  output: Q:\Development\Marketor\shorts_out
  database: Q:\Development\Marketor\shorts.db
  archive: Q:\Development\Marketor\clips_processed
clip:
  # 4:5 plutot que 9:16. En 9:16 la fenetre ne fait que 608 px d'une source
  # 1920 : le joueur sort du cadre et le decor n'est plus lisible. En 4:5 elle
  # en fait 864, et le format reste vertical donc eligible partout.
  width: 1080
  height: 1350
  fps: 60
  min_duration: 14.0
  max_duration: 55.0
  lead_in: 13.0
  lead_out: 7.0
  follow_action: true
  action_gap: 6.0
  action_min_weight: 5.0
  quiet_lead_in: 7.0
  lufs: -14.0
  reframe: crop
  track_damping: 0.85
  tracking: true
  track_deadzone: 0.60
  track_smoothing: 2.0
  track_safe_fraction: 0.86
  track_rescue_px_per_s: 700.0
  widen_when_needed: true
  widen_coverage: 0.8
  widen_max_fraction: 0.72
  # Marges autour d'un changement de scene. Le level_start arrive quand la
  # scene est chargee, mais l'image a deja commence a changer avant.
  # Un clip couvre une seule tentative : il finit sur la mort ou la victoire,
  # et ne commence pas dans le fondu de reapparition de la precedente.
  death_tail: 0.40
  victory_tail: 1.6
  respawn_margin: 5.2
  level_end_margin: 2.5
  level_start_margin: 1.5
  # Montage: zoom lent, coup de zoom sur l'evenement, arret sur image final.
  zoom_push: 0.0
  zoom_punch: 0.05
  zoom_punch_seconds: 1.1
  freeze_end: 0.6
selection:
  # Budget proportionnel a la duree, borne par les deux suivants.
  minutes_per_clip: 1.5
  min_clips_per_video: 3
  max_clips_per_video: 14
  cap_scale_minutes: 10.0
  min_gap_between_clips: 25.0
  same_spot_radius: 100.0
  wall_burst_bonus: 0.10
  idle_speed: 1.0
  max_idle_fraction: 0.60
  near_miss_damage_guard: 2.0
  near_miss_min_distance: 0.15
  hazard_bonus: 0.06
  rate_window: 20.0
  near_miss_bonus: 0.05
  max_per_event:
    bonus_near_miss: 2
    wallrun: 2
    burst: 2
    wall_near_miss: 2
    speed_peak: 2
    input_flurry: 2
    grapple_attach: 2
    shield_hit: 2
    bonus_pickup: 1
    checkpoint: 1
  weights:
    bonus_lost: 11.0
    waveburst: 10.5
    jelly_combo: 10.0
    ghost_lead_change: 9.8
    projectile_near_miss: 9.5
    victory: 9.0
    bonus_secured: 8.5
    bonus_near_miss: 8.0
    worm_near: 8.0
    wall_near_miss: 7.0
    speed_peak: 7.0
    wallrun: 7.0
    death: 5.5
    input_flurry: 5.5
    bonus_pickup: 5.0
    burst: 7.0
    grapple_attach: 3.0
    powerup_pickup: 2.5
    shield_hit: 2.0
    checkpoint: 0.5
  ignore_death_causes:
  - stuck
  fast_speed: 18.0
